name: Feature Request
description: Suggest a new feature.
title: "[Feature]: "
labels:
    - enhancement

body:
    - type: markdown
      attributes:
          value: |
              Thank you for your suggestion.

    - type: textarea
      id: problem
      attributes:
          label: Problem
          description: What problem does this solve?
      validations:
          required: true

    - type: textarea
      id: solution
      attributes:
          label: Proposed solution
      validations:
          required: true

    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives considered

    - type: textarea
      id: additional
      attributes:
          label: Additional information
