name: Bug Report
description: Report an unexpected behavior or defect.
title: "[Bug]: "
labels:
    - bug

body:
    - type: markdown
      attributes:
          value: |
              Thank you for taking the time to report this issue.

    - type: textarea
      id: description
      attributes:
          label: Description
          description: Describe the problem.
          placeholder: What happened?
      validations:
          required: true

    - type: textarea
      id: steps
      attributes:
          label: Steps to reproduce
          placeholder: |
              1.
              2.
              3.
      validations:
          required: true

    - type: textarea
      id: expected
      attributes:
          label: Expected behavior
      validations:
          required: true

    - type: textarea
      id: actual
      attributes:
          label: Actual behavior
      validations:
          required: true

    - type: input
      id: version
      attributes:
          label: Orange Cat Lang version
          placeholder: e.g. 0.1.0

    - type: input
      id: bun
      attributes:
          label: Bun version

    - type: input
      id: os
      attributes:
          label: Operating system
